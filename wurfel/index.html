<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>MinimalistWürfel</title>
  <script src="../libraries/p5.js"></script>
  <script src="../libraries/matter.js"></script>
  <script src="../libraries/matter-wrap.js"></script>
  <script src="../classes/BlockCore.js"></script>
  <script src="../classes/Block.js"></script>
  <script src="../classes/Ball.js"></script>
  <script src="../classes/Mouse.js"></script>
  <script src="wurfel.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      background-color: #d3d3d3;
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      overscroll-behavior: none;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      touch-action: none;
    }
  </style>
</head>
<body>
</body>
</html>
