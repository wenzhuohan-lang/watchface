<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MinimalistWürfel</title>

  <script src="../libraries/p5.js"></script>
  <script src="../libraries/matter.js"></script>
  <script src="../libraries/matter-wrap.js"></script>

  <script src="../classes/BlockCore.js"></script>
  <script src="../classes/Block.js"></script>
  <script src="../classes/Ball.js"></script>
  <script src="../classes/Mouse.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* 关键：手机不要出现页面滚动/放大 */
      background: #d3d3d3;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      /* iOS 刘海安全区 */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      touch-action: none; /* 关键：避免触摸拖拽导致页面缩放/滚动 */
    }
  </style>
</head>

<body>
  <!-- 让 p5 自动插入 canvas -->
  <script src="MinimalistWürfel.js"></script>
</body>
</html>
